    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #1e1e1e;
        color: #ffffff; /* Set default text color to white */
        margin: 0;
      }
      input,
      select,
      textarea {
        background-color: #2b2b2b; /* Dark background */
        color: #ffffff; /* White text */
        border: 1px solid #444; /* Darker border */
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none; /* Remove default focus outline */
        border-color: #5f9cf4; /* Add a focus border color */
        box-shadow: 0 0 5px #5f9cf4; /* Glow effect on focus */
      }

      #messageModal {
        display: none; /* Hidden by default */
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
        z-index: 1000; /* Ensure it appears above other content */
      }

      #messageModal .modal-content {
        width: 33%; /* Control the modal width */
        max-width: 500px;
        background-color: #ffffff;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); /* Add some shadow for better visibility */
      }

      .modal-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%; /* Make sure it spans the full screen height */
      }

      label {
        color: #ffffff; /* Ensure all labels are white */
      }
    </style>

    <script>
      const {ipcRenderer} = require('electron');
      const fs = require('fs');
      const path = require('path');
      const {baseURL} = require('../../../env.js');
      const {fetchCompanyList} = require('./integration-gateway.service.js');
      document.addEventListener('DOMContentLoaded', () => {
        fetchCompanyList();
      });
      // display company list
      ipcRenderer.invoke('read-companyList');
      ipcRenderer.on('send-companyList', (event, companies) => {
        const companyCode = document.getElementById('companyCode');
        const env = document.getElementById('env');
        companies.forEach((company) => {
          const option = document.createElement('option');
          const envOption = document.createElement('option');
          option.value = company.code;
          option.textContent = company.name;
          company?.environment.forEach((envItem) => {
            envOption.value = envItem;
            envOption.textContent = envItem;
            env.appendChild(envOption);
          });
          companyCode.appendChild(option);
        });
      });

      // file upload to server
      // const uploadButton = document.getElementById('uploadButton');
      // uploadButton.addEventListener('click', () => {
      //   // ipcRenderer.send('file:upload', {
      //   //   file: '/Users/appasaheb4/Library/Application Support/limsplus-lite/user-preferences.json',
      //   // });
      //   ipcRenderer.send('file:upload', {
      //     file: '/Users/appasaheb4/Library/Application Support/limsplus-lite/received-message.json',
      //   });
      // });

      ipcRenderer.on('upload:complete', (event, message) => {
        alert(message);
      });

      ipcRenderer.on('stored-received-message', (event, message) => {
        ipcRenderer.send('file:upload', {
          url: `${baseURL()}/communication/uploadFile`,
          file: '/Users/appasaheb4/Library/Application Support/limsplus-lite/received-message.json',
          ip: '',
          tcpPort: '',
          companyCode: '',
          instrumentType: '',
          environment: '',
          instrumentId: '',
        });
      });

      function sendDetails(tcpPort) {
        const ip = document.getElementById('ip').value;
        const serverFolderPath = path.join(__dirname, 'server');
        const targetFilePath = path.join(serverFolderPath, `${ip}.txt`);
        // Check if the file exists
        if (fs.existsSync(targetFilePath)) {
          // Read the content of the file
          fs.readFile(targetFilePath, 'utf8', (err, data) => {
            if (err) {
              console.error('Error reading file:', err);
              alert('Failed to read the file.');
            } else {
              alert(`File content of ${ip}.txt: \n${data}`);
              console.log(`File content:\n${data}`);
            }
          });
        } else {
          alert(`No file found with the name ${ip}.txt in the server folder.`);
          console.error('File not found:', targetFilePath);
        }
      }

      function appendLog(message) {
        const logTextarea = document.getElementById('secondSpaceContent');
        logTextarea.value += message + '\n';
        logTextarea.scrollTop = logTextarea.scrollHeight;
      }

      ipcRenderer.on('ws-connected', (event, message) => {
        appendLog(message);
        // Now start the TCP server after WebSocket connection
        const ip = document.getElementById('ip').value;
        const tcpPort = document.getElementById('tcpPort').value;
        ipcRenderer.invoke('start-server', ip, tcpPort);
        document.getElementById('connectButton').disabled = true;
        document.getElementById('ip').disabled = true;
        document.getElementById('companyCode').disabled = true;
        document.getElementById('intrumentType').disabled = true;
        document.getElementById('tcpPort').disabled = true;
        document.getElementById('env').disabled = true;
        document.getElementById('instId').disabled = true;
        document.getElementById('disconnectButton').disabled = false;
        document.getElementById('connectButton').innerText = 'Connected';
        document.getElementById('connectButton').classList.add('bg-gray-500');
        document.getElementById('disconnectButton').classList.add('bg-red-500');
        document
          .getElementById('disconnectButton')
          .classList.remove('bg-gray-500');
      });
      ipcRenderer.on('ws-disconnected', (event, message) => {
        appendLog(message);
        document.getElementById('connectButton').disabled = false;
        document.getElementById('ip').disabled = false;
        document.getElementById('companyCode').disabled = false;
        document.getElementById('intrumentType').disabled = false;
        document.getElementById('tcpPort').disabled = false;
        document.getElementById('env').disabled = false;
        document.getElementById('instId').disabled = false;
        document.getElementById('disconnectButton').disabled = true;
        document.getElementById('connectButton').innerText = 'Connect';
        document.getElementById('connectButton').classList.add('bg-blue-500');
        document
          .getElementById('connectButton')
          .classList.remove('bg-gray-500');
        document
          .getElementById('disconnectButton')
          .classList.remove('bg-red-500');
        document
          .getElementById('disconnectButton')
          .classList.add('bg-gray-500');
      });
      ipcRenderer.on('ws-data', (event, data) => {
        appendLog(data);
      });
      ipcRenderer.on('ws-error', (event, error) => {
        appendLog('Error: ' + error);
      });
      ipcRenderer.on('server-message', (event, message) => {
        appendLog(message);
      });
      function openMessageModal() {
        const modal = document.getElementById('messageModal');
        modal.classList.remove('hidden');
        modal.style.display = 'flex'; // Set display to flex for centering
