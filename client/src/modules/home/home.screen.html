<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LimsPlus Connect</title>
    <link href="../../../output.css" rel="stylesheet" />
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #1e1e1e;
        margin: 0;
      }
      .header {
        display: flex;
        padding: 10px;
        background-color: #3a3a3a;
        color: #cccccc;
        font-weight: bold;
        font-size: 14px;
        border-bottom: 1px solid #555;
      }

      .header span {
        margin-right: 20px;
        cursor: pointer;
        position: relative;
        padding-bottom: 5px;
      }

      .header span:hover {
        color: #00bcd4;
      }

      .header span.active::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 2px;
        background-color: #00bcd4;
      }

      .container {
        display: flex;
        padding: 20px;
        gap: 10px;
      }

      .column {
        flex: 1;
        display: flex;
        flex-direction: column;
        background-color: #2a2a2a;
        padding: 10px;
        border-radius: 5px;
      }

      .title {
        background-color: #00bcd4;
        color: #1e1e1e;
        text-align: center;
        padding: 10px;
        font-weight: bold;
        border-radius: 5px;
        margin-bottom: 10px;
      }

      .section,
      .item {
        background-color: #333;
        color: #ddd;
        padding: 10px;
        margin: 5px 0;
        border-radius: 5px;
        text-align: center;
        font-size: 14px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .section {
        font-weight: bold;
        padding-left: 5px;
        text-align: left;
      }

      .item:hover {
        background-color: #555;
      }
    </style>
  </head>
  <body class="bg-gradient-to-r from-purple-600 to-blue-500 min-h-screen">
    <div class="flex header justify-between w-full">
      <div class="flex">
        <span class="active">Origin</span>
        <span>Notification</span>
        <span>Clipboard Parser</span>
      </div>
      <div class="flex">
        <span id="userId">Welcome </span>
      </div>
    </div>
    <div class="container">
      <div class="column workspaces">
        <div class="title">Workspaces</div>
        <div class="section">Global</div>
        <button class="item" onclick="navigateToSecondScreen()">
          Integration Gateway
        </button>
        <button class="item" onclick="navigateToReact()">LimsPlus Lite</button>
        <button class="item">Backup/Restore</button>
      </div>
      <div class="column reports">
        <div class="title">Reports</div>
        <button class="item">Aged/Odd Lot</button>
      </div>
    </div>
    <script>
      const {ipcRenderer} = require('electron');
      ipcRenderer.invoke('read-user');
      ipcRenderer.on('send-user', (event, user) => {
        document.getElementById('userId').innerText = `Welcome ${user.userId}`;
      });
      function navigateToSecondScreen() {
        ipcRenderer.send('navigate-to-second-screen');
      }
      function navigateToReact() {
        ipcRenderer.send('navigate-to-react');
      }
    </script>
  </body>
</html>
